name: task_board
description: "My Boards — a personal task board app (Flutter port of the HTML original)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  # Used only by the APK shell entrypoint (lib/main_shell.dart) to host the
  # web app inside a native WebView. Not used by the web build.
  webview_flutter: ^4.10.0
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    # Each file bundles both Latin + Hebrew glyphs (merged), so both scripts
    # render from the bundled fonts — offline, no CDN fallback needed.
    - family: Assistant
      fonts:
        - asset: assets/fonts/Assistant-Regular.ttf
          weight: 400
        - asset: assets/fonts/Assistant-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Assistant-Bold.ttf
          weight: 700
    - family: SecularOne
      fonts:
        - asset: assets/fonts/SecularOne-Regular.ttf
          weight: 400
