name: Deploy Web App

# Builds the Flutter web app (lib/main.dart) and publishes it to GitHub Pages.
# This is what the installed APK shell loads, so pushing here is how features
# and fixes go live — instantly, with no APK reinstall.

on:
  push:
    branches:
      - claude/html-flutter-conversion-asjw5s
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # base-href must match the Pages sub-path for a project site:
      # https://<owner>.github.io/<repo>/
      # --pwa-strategy=none: no service worker. The app is always loaded online
      # inside a WebView, so the SW gives no offline benefit and only causes
      # stale versions after a deploy. Disabling it makes updates show instantly.
      - name: Build web
        run: flutter build web --release --base-href /Task-board/ --pwa-strategy=none

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
