name: Build Android APK

# Builds the thin WebView "shell" APK (lib/main_shell.dart) on GitHub's
# runners. The shell just loads the web app hosted on GitHub Pages, so this
# APK is installed once and rarely needs rebuilding — new features/fixes ship
# by redeploying the web build (see deploy-web.yml), not by reinstalling.
# Runs on every push to the branch, and can be started manually from the
# Actions tab ("Run workflow").

# Manual-only: the shell APK rarely changes, so we build it on demand (from
# the Actions tab, "Run workflow") rather than on every push. Feature work
# ships via the web deploy (deploy-web.yml); we rebuild this APK only when the
# native shell itself changes (e.g. notifications).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK (WebView shell)
        run: flutter build apk --release --target lib/main_shell.dart

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: task-board-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Publish a Release with the APK attached so it can be downloaded and
      # installed directly on a phone (permanent link, no login, no unzip).
      - name: Publish APK to a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest APK
          body: |
            Install-once WebView shell APK of **My Boards**. It loads the app
            from the web, so features and fixes update online automatically —
            no need to reinstall this APK.

            Download `app-release.apk` below and open it on your Android phone
            to install (you may need to allow "install from unknown sources").
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
