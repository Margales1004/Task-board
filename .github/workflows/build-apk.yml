name: Build Android APK

# Builds a release APK on GitHub's runners (which can reach the Android SDK /
# Google Maven, unlike the sandbox this was developed in) and uploads it as a
# downloadable artifact. Runs on every push to the branch, and can be started
# manually from the Actions tab ("Run workflow").

on:
  push:
    branches:
      - claude/html-flutter-conversion-asjw5s
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: task-board-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Publish a Release with the APK attached so it can be downloaded and
      # installed directly on a phone (permanent link, no login, no unzip).
      - name: Publish APK to a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest APK
          body: |
            Automatically built release APK of **My Boards**.
            Download `app-release.apk` below and open it on your Android phone
            to install (you may need to allow "install from unknown sources").
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
