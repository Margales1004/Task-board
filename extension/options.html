<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>My Boards — Quick Capture options</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 560px; margin: 32px auto; padding: 0 20px; line-height: 1.5;
    }
    h1 { font-size: 20px; margin-bottom: 4px; }
    p.sub { color: #68788a; margin-top: 0; }
    label { display: block; font-weight: 600; margin: 18px 0 6px; }
    input {
      width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 14px;
      border: 1.5px solid #d9dee5; border-radius: 10px; background: transparent;
      color: inherit;
    }
    .row { display: flex; gap: 10px; margin-top: 20px; }
    button {
      padding: 11px 18px; font-size: 15px; font-weight: 700; border: none;
      border-radius: 10px; cursor: pointer;
    }
    #save { background: #16222f; color: #fff; }
    #test { background: #eef2f7; color: #16222f; }
    #status { margin-top: 14px; font-size: 14px; min-height: 20px; }
    .note { color: #68788a; font-size: 13px; margin-top: 22px; }
    code { background: #eef2f7; padding: 1px 5px; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>My Boards — Quick Capture</h1>
  <p class="sub">Pair this extension with your app so captured tasks land in your Inbox.</p>

  <label for="dbUrl">Firebase database URL</label>
  <input id="dbUrl" type="url" placeholder="https://your-project-default-rtdb.firebaseio.com" />

  <label for="code">Pairing code</label>
  <input id="code" type="text" placeholder="Paste the code shown in the app’s Browser capture settings" />

  <div class="row">
    <button id="save">Save</button>
    <button id="test">Send a test task</button>
  </div>
  <div id="status"></div>

  <p class="note">
    Find both values in the app: <b>⚙ Settings → Browser capture</b>. The URL and
    code must match exactly on both sides. Keep the code private.
  </p>

  <script src="options.js"></script>
</body>
</html>
