<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Add to My Boards</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0; padding: 18px; line-height: 1.4;
    }
    h1 { font-size: 16px; margin: 0 0 12px; }
    label { display: block; font-weight: 600; font-size: 13px; margin: 12px 0 5px; }
    input, textarea {
      width: 100%; box-sizing: border-box; padding: 9px 11px; font-size: 14px;
      border: 1.5px solid #d9dee5; border-radius: 9px; background: transparent;
      color: inherit; font-family: inherit;
    }
    textarea { resize: vertical; min-height: 54px; }
    .row { display: flex; gap: 10px; margin-top: 16px; }
    button { padding: 10px 16px; font-size: 14px; font-weight: 700; border: none; border-radius: 9px; cursor: pointer; }
    #send { background: #16222f; color: #fff; flex: 1; }
    #cancel { background: #eef2f7; color: #16222f; }
    #status { margin-top: 10px; font-size: 13px; min-height: 18px; color: #c0392b; }
  </style>
</head>
<body>
  <h1>Add to My Boards</h1>
  <label for="name">Task</label>
  <input id="name" type="text" placeholder="What needs to get done?" />
  <label for="note">Note</label>
  <textarea id="note" placeholder="Link or details (optional)"></textarea>
  <div class="row">
    <button id="send">Add task</button>
    <button id="cancel">Cancel</button>
  </div>
  <div id="status"></div>
  <script src="edit.js"></script>
</body>
</html>
